server_url: https://rrjp.zeabur.app
listen_addr: 0.0.0.0:8080

# 数据库（先用 SQLite 测试）
db_type: sqlite3
db_path: /var/lib/headscale/db.sqlite

private_key_path: /var/lib/headscale/private.key
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# ==================== DNS 配置 ====================
dns:
  override_local_dns: true   # 如果不需要覆盖本地DNS，可改为 false
  nameservers:
    global:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
  # 可选：其他 DNS 设置
  # base_domain: yourdomain.com
  # magic_dns: true
